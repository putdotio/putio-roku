name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable tag to resume or redeploy, for example v2.14.1
        required: true
        type: string

concurrency:
  group: roku-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    name: Verify Roku app
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .node-version

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify repository
        run: pnpm verify

  release:
    if: >-
      ${{
        github.ref == 'refs/heads/main' &&
        (
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]'))
        )
      }}
    name: Publish GitHub release
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    needs:
      - verify
    environment:
      name: release
      deployment: false
    permissions:
      contents: read
    outputs:
      release_ready: ${{ steps.finalized.outputs.ready }}
      release_tag: ${{ steps.release-target.outputs.tag }}
      release_version: ${{ steps.release-target.outputs.version }}

    steps:
      - name: Create release bot token
        id: release-bot
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.PUTIO_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.PUTIO_RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write

      - name: Resolve release bot identity
        id: release-bot-identity
        shell: bash
        env:
          GH_TOKEN: ${{ steps.release-bot.outputs.token }}
          APP_SLUG: ${{ steps.release-bot.outputs.app-slug }}
        run: |
          set -euo pipefail
          user_id="$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)"
          if [[ ! "$user_id" =~ ^[0-9]+$ ]]; then
            echo "failed to resolve numeric bot user id for ${APP_SLUG}[bot]" >&2
            exit 1
          fi
          echo "user_id=${user_id}" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.release-bot.outputs.token }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .node-version

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          cache: false

      - name: Install dependencies
        if: github.event_name != 'workflow_dispatch'
        run: pnpm install --frozen-lockfile

      # The licensed GT America faces are gitignored, so the checkout has none of them and the
      # packaged app would silently fall back to the Roku system font. Fetch them from put.io's
      # own CDN before semantic-release builds the artifact. No credential is involved: the
      # faces are served over plain HTTPS from static.put.io. fonts-setup is the gate -- it
      # fails on any download or validation problem, so reaching the build means every listed
      # face is on disk and is a real GT America face. fonts-check then re-checks those bytes,
      # but note it treats absence as a legitimate optional state, so it would not by itself
      # catch a step that silently synced nothing.
      - name: Sync licensed brand fonts
        if: github.event_name != 'workflow_dispatch'
        run: |
          pnpm roku fonts-setup
          pnpm roku fonts-check

      - name: Release Roku package
        if: github.event_name != 'workflow_dispatch'
        id: semantic
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        with:
          extra_plugins: |
            @semantic-release/commit-analyzer@13.0.1
            @semantic-release/release-notes-generator@14.1.1
            @semantic-release/exec@7.1.0
            @semantic-release/git@10.0.1
            @semantic-release/github@12.0.8
            conventional-changelog-conventionalcommits@9.1.0
        env:
          GITHUB_TOKEN: ${{ steps.release-bot.outputs.token }}
          GIT_AUTHOR_NAME: ${{ steps.release-bot.outputs.app-slug }}[bot]
          GIT_AUTHOR_EMAIL: ${{ steps.release-bot-identity.outputs.user_id }}+${{ steps.release-bot.outputs.app-slug }}[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: ${{ steps.release-bot.outputs.app-slug }}[bot]
          GIT_COMMITTER_EMAIL: ${{ steps.release-bot-identity.outputs.user_id }}+${{ steps.release-bot.outputs.app-slug }}[bot]@users.noreply.github.com

      - name: Resolve exact release target
        id: release-target
        env:
          GH_TOKEN: ${{ steps.release-bot.outputs.token }}
          NEW_RELEASE_TAG: ${{ steps.semantic.outputs.new_release_git_tag }}
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          git fetch origin main --tags --force

          tag="${REQUESTED_RELEASE_TAG:-$NEW_RELEASE_TAG}"
          if [[ -z "$tag" ]]; then
            echo "state=absent" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "unsupported release tag: $tag" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$tag" origin/main; then
            echo "release tag is not on origin/main: $tag" >&2
            exit 1
          fi

          release="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets,isDraft,isPrerelease,tagName)"

          if [[ "$(jq -r .tagName <<<"$release")" != "$tag" ]]; then
            echo "release lookup returned the wrong tag" >&2
            exit 1
          fi
          if [[ "$(jq -r .isPrerelease <<<"$release")" != "false" ]]; then
            echo "stable release tag resolved to a prerelease: $tag" >&2
            exit 1
          fi

          is_draft="$(jq -r .isDraft <<<"$release")"
          if [[ "$is_draft" == "false" ]]; then
            expected="putio-roku-${tag}.zip"
            [[ "$(jq -r --arg expected "$expected" '[.assets[].name] == [$expected]' <<<"$release")" == "true" ]]
          fi
          {
            echo "tag=$tag"
            echo "version=${tag#v}"
            echo "state=$([[ "$is_draft" == "true" ]] && echo draft || echo published)"
          } >> "$GITHUB_OUTPUT"

      - name: Check out recovery tag
        if: github.event_name == 'workflow_dispatch' && steps.release-target.outputs.state == 'draft'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: refs/tags/${{ steps.release-target.outputs.tag }}
          token: ${{ steps.release-bot.outputs.token }}

      - name: Install recovery dependencies
        if: github.event_name == 'workflow_dispatch' && steps.release-target.outputs.state == 'draft'
        run: pnpm install --frozen-lockfile

      - name: Sync licensed brand fonts for recovery
        if: github.event_name == 'workflow_dispatch' && steps.release-target.outputs.state == 'draft'
        run: |
          if [[ -f config/brand-fonts.json ]]; then
            pnpm roku fonts-setup
            pnpm roku fonts-check
          fi

      # The GitHub CLI uploader avoids the undici content-length failures seen in
      # @semantic-release/github. Assets stay on the mutable draft until verified.
      - name: Attach sideload ZIP to the release
        if: steps.release-target.outputs.state == 'draft'
        env:
          GH_TOKEN: ${{ steps.release-bot.outputs.token }}
          RELEASE_TAG: ${{ steps.release-target.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release-target.outputs.version }}
        run: |
          set -euo pipefail
          zip="dist/release/putio-roku-v${RELEASE_VERSION}.zip"
          if [[ ! -f "$zip" ]]; then
            node scripts/prepare-release.ts "$RELEASE_VERSION"
          fi
          test -f "$zip"
          gh release upload "$RELEASE_TAG" "$zip" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Verify and publish draft release
        if: steps.release-target.outputs.state == 'draft'
        env:
          GH_TOKEN: ${{ steps.release-bot.outputs.token }}
          RELEASE_TAG: ${{ steps.release-target.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release-target.outputs.version }}
        run: |
          set -euo pipefail
          expected="putio-roku-v${RELEASE_VERSION}.zip"
          release="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets,isDraft,isPrerelease)"
          [[ "$(jq -r .isDraft <<<"$release")" == "true" ]]
          [[ "$(jq -r .isPrerelease <<<"$release")" == "false" ]]
          [[ "$(jq -r --arg expected "$expected" '[.assets[].name] == [$expected]' <<<"$release")" == "true" ]]
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest

      - name: Mark release ready
        if: steps.release-target.outputs.state != 'absent'
        id: finalized
        run: echo "ready=true" >> "$GITHUB_OUTPUT"

  deploy:
    if: ${{ needs.release.outputs.release_ready == 'true' }}
    name: Deploy released ZIP
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    needs:
      - release
    environment:
      name: production
      url: https://${{ vars.ROKU_DOMAIN }}/v2.zip
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROUTE53_ZONE_ID: ${{ vars.AWS_ROUTE53_ZONE_ID }}
      AWS_WILDCARD_CERT_ARN: ${{ vars.AWS_WILDCARD_CERT_ARN }}
      ROKU_DOMAIN: ${{ vars.ROKU_DOMAIN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.release.outputs.release_tag }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .node-version

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare hosted release payload
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.release.outputs.release_version }}
        run: |
          set -euo pipefail

          release_asset="putio-roku-v${RELEASE_VERSION}.zip"
          release_tag="v${RELEASE_VERSION}"

          rm -rf dist/public dist/release
          mkdir -p dist/public/releases/v2 dist/release

          gh release download "${release_tag}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "${release_asset}" \
            --dir dist/release

          release_zip="dist/release/${release_asset}"
          test -f "${release_zip}"
          unzip -t "${release_zip}" > /dev/null

          cp "${release_zip}" dist/public/v2.zip
          cp "${release_zip}" "dist/public/releases/v2/${RELEASE_VERSION}.zip"

          # Publish the curated visual reference gallery at /vref. Inject
          # <base href="/vref/"> so the gallery's relative asset paths resolve
          # whether it is served at /vref, /vref/, or /vref/index.html.
          mkdir -p dist/public/vref
          sed 's#<head>#<head><base href="/vref/">#' .vref/index.html > dist/public/vref/index.html
          cp .vref/manifest.json dist/public/vref/
          cp -R .vref/screenshots dist/public/vref/

          # Root landing: redirect bare domain + unknown paths to the gallery
          cp infra/site-root/index.html dist/public/index.html

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}

      - name: Deploy Roku site
        run: pnpm deploy:production
