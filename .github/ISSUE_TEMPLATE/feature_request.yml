name: Feature request
description: Suggest a new screen, setting, or playback capability.
title: ""
labels:
  - enhancement
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: State the outcome you need.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
  - type: textarea
    id: workaround
    attributes:
      label: Current workaround
      description: How you solve this today, if at all.
